<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== SEO基本(ページごとに必ず書き換える) ===== -->
  <title>{{ページタイトル}}|{{サイト名}}</title>
  <meta name="description" content="{{ページの説明文(120字以内)}}">
  <link rel="canonical" href="{{ページの正規URL}}">

  <!-- ===== OGP(SNSシェア用) ===== -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ページタイトル}}">
  <meta property="og:description" content="{{ページの説明文}}">
  <meta property="og:url" content="{{ページの正規URL}}">
  <meta property="og:image" content="{{OGP画像URL(1200x630px)}}">
  <meta property="og:site_name" content="{{サイト名}}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- ===== ファビコン ===== -->
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- ===== フォント(Brand.md 指定:Noto Sans JP / Montserrat / Inter) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- ===== CSS(CSS_TEMPLATE を利用) ===== -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">{{サイト名}}</a>
      <nav aria-label="メインナビゲーション">
        <ul>
          <li><a href="#about">{{メニュー1}}</a></li>
          <li><a href="#service">{{メニュー2}}</a></li>
          <li><a href="#contact" class="btn btn--primary">{{CTAボタン}}</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===== コンテンツをここに実装 ===== -->
    <section class="section" id="about">
      <div class="container">
        <h2 class="section-title">
          <span class="section-title__en">{{英語ラベル}}</span>
          {{セクション見出し}}
        </h2>
        <p>{{本文}}</p>
      </div>
    </section>
  </main>

  <!-- ===== フッター ===== -->
  <footer class="site-footer section--dark">
    <div class="container text-center">
      <p>&copy; <span id="year">2026</span> {{サイト名/会社名}}</p>
    </div>
  </footer>

  <script>
    // フッターの年号を自動更新
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
